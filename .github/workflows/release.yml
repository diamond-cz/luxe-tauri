name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
  watch:
    types: [started]

permissions:
  contents: read

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'watch' && github.event.repository.default_branch || inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify release tag
        id: release_tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'watch') {
            $version = (Get-Content src-tauri/tauri.conf.json -Encoding UTF8 -Raw | ConvertFrom-Json).version
            $tag = "v$version"
          } elseif ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG
          } else {
            $tag = $env:REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected vX.Y.Z tag' }
          if ((git tag --list $tag) -ne $tag) { throw "Tag $tag does not exist" }
          if ($env:EVENT_NAME -eq 'watch') {
            git checkout --detach "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not check out $tag" }
          }
          $tagCommit = git rev-list -n 1 "refs/tags/$tag"
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw "Checkout does not match tag $tag" }
          $version = (Get-Content src-tauri/tauri.conf.json -Encoding UTF8 -Raw | ConvertFrom-Json).version
          if ($version -ne $tag.Substring(1)) { throw "Tag $tag does not match version $version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building $tag at $headCommit"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Validate release input and signing secrets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing GitHub Secret TAURI_SIGNING_PRIVATE_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing GitHub Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD'
          }
          Write-Host 'Updater signing secrets are available.'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200 -and -not ($response.Content | ConvertFrom-Json).draft) {
            throw "Published release $env:RELEASE_TAG already exists"
          }
          if ($response.StatusCode -notin @(200, 404)) {
            throw "Release lookup failed with HTTP $($response.StatusCode)"
          }
          Write-Host "Release state checked (HTTP $($response.StatusCode))."

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized version files
        shell: pwsh
        run: |
          npm run version:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Commit the synchronized version files before tagging' }

      - name: Check frontend
        run: npm run typecheck

      - name: Test release manifest generation
        run: node --test scripts/prepare-release.test.mjs

      - name: Test Rust
        run: npm run rust:test

      - name: Build NSIS and MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis,msi

      - name: Validate packages and create updater manifest
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: node scripts/prepare-release.mjs $env:RELEASE_TAG

      - name: Create draft, upload, verify, and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          ASSET1: ${{ steps.assets.outputs.asset1 }}
          ASSET2: ${{ steps.assets.outputs.asset2 }}
          ASSET3: ${{ steps.assets.outputs.asset3 }}
          ASSET4: ${{ steps.assets.outputs.asset4 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "LUXE $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          } elseif ($response.StatusCode -eq 200 -and -not ($response.Content | ConvertFrom-Json).draft) {
            throw "Published release $env:RELEASE_TAG already exists"
          } elseif ($response.StatusCode -ne 200) {
            throw "Release lookup failed with HTTP $($response.StatusCode)"
          }
          $assets = @($env:ASSET1, $env:ASSET2, $env:ASSET3, $env:ASSET4)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          $published = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect draft release' }
          foreach ($asset in $assets) {
            $name = Split-Path $asset -Leaf
            if ($name -notin @($published.assets.name)) { throw "Missing uploaded asset: $name" }
          }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
