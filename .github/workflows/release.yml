name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true

permissions:
  contents: read

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify release tag
        id: release_tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG
          } else {
            $tag = $env:REF_NAME
          }
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Expected vX.Y.Z tag' }
          if ((git tag --list $tag) -ne $tag) { throw "Tag $tag does not exist" }
          $tagCommit = git rev-list -n 1 "refs/tags/$tag"
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) { throw "Checkout does not match tag $tag" }
          $version = (Get-Content src-tauri/tauri.conf.json -Encoding UTF8 -Raw | ConvertFrom-Json).version
          if ($version -ne $tag.Substring(1)) { throw "Tag $tag does not match version $version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building $tag at $headCommit"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Validate release input and signing secrets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing GitHub Secret TAURI_SIGNING_PRIVATE_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing GitHub Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD'
          }
          # The private key is the Base64 text in .tauri-updater.key. Check it
          # before the lengthy Rust build, and remove copied line endings.
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          try {
            $keyBytes = [Convert]::FromBase64String($key)
          } catch {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not valid Base64. Replace this GitHub Secret with the complete contents of .tauri-updater.key, not the public key or file path.'
          }
          if ([Convert]::ToBase64String($keyBytes) -cne $key) {
            throw 'TAURI_SIGNING_PRIVATE_KEY contains extra characters or line breaks. Copy the complete .tauri-updater.key value again.'
          }
          $password = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.TrimEnd("`r", "`n")
          if ([string]::IsNullOrWhiteSpace($password) -or $password.Contains("`r") -or $password.Contains("`n")) {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be the single-line contents of .tauri-updater.password.'
          }
          Write-Host 'Updater signing secrets have valid shape.'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200 -and -not ($response.Content | ConvertFrom-Json).draft) {
            throw "Published release $env:RELEASE_TAG already exists"
          }
          if ($response.StatusCode -notin @(200, 404)) {
            throw "Release lookup failed with HTTP $($response.StatusCode)"
          }
          Write-Host "Release state checked (HTTP $($response.StatusCode))."

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing key and password
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.TrimEnd("`r", "`n")
          $probe = Join-Path $env:RUNNER_TEMP 'updater-signing-probe.txt'
          Set-Content -LiteralPath $probe -Value 'updater signing probe' -NoNewline
          $version = (Get-Content src-tauri/tauri.conf.json -Encoding UTF8 -Raw | ConvertFrom-Json).version
          node node_modules/@tauri-apps/cli/tauri.js signer sign $probe --app-version $version | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "$probe.sig" -PathType Leaf)) {
            throw 'Updater signing probe failed. Recheck the GitHub private-key and password Secrets.'
          }
          Write-Host 'Updater signing key and password work.'

      - name: Verify synchronized version files
        run: npm run version:check

      - name: Test release scripts
        run: npm run release:test

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-x64
          cache-on-failure: true

      # beforeBuildCommand builds the frontend once. The resulting dist/ is
      # also required by tauri::generate_context! when running Rust tests.
      - name: Build application without installers
        run: npm run tauri -- build --no-bundle --ci -- --locked

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS and MSI
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Cached build directories can contain installers from another tag.
          # Only remove the generated bundle subtree, retaining compiled code.
          $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target'))
          $bundle = [IO.Path]::GetFullPath((Join-Path $target 'release/bundle'))
          if (-not $bundle.StartsWith("$target$([IO.Path]::DirectorySeparatorChar)", [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Bundle cleanup path is outside the build directory'
          }
          if (Test-Path -LiteralPath $bundle) { Remove-Item -LiteralPath $bundle -Recurse -Force }
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.TrimEnd("`r", "`n")
          npm run tauri -- bundle --bundles nsis,msi --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate packages and create updater manifest
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: node scripts/prepare-release.mjs $env:RELEASE_TAG

      - name: Archive verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ steps.release_tag.outputs.tag }}
          path: |
            ${{ steps.assets.outputs.asset1 }}
            ${{ steps.assets.outputs.asset2 }}
            ${{ steps.assets.outputs.asset3 }}
            ${{ steps.assets.outputs.asset4 }}
            ${{ steps.assets.outputs.asset5 }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Create draft, upload, verify, and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          ASSET1: ${{ steps.assets.outputs.asset1 }}
          ASSET2: ${{ steps.assets.outputs.asset2 }}
          ASSET3: ${{ steps.assets.outputs.asset3 }}
          ASSET4: ${{ steps.assets.outputs.asset4 }}
          ASSET5: ${{ steps.assets.outputs.asset5 }}
          RELEASE_NOTES: ${{ steps.assets.outputs.notesFile }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "LUXE $env:RELEASE_TAG" --notes-file $env:RELEASE_NOTES
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          } elseif ($response.StatusCode -eq 200 -and -not ($response.Content | ConvertFrom-Json).draft) {
            throw "Published release $env:RELEASE_TAG already exists"
          } elseif ($response.StatusCode -ne 200) {
            throw "Release lookup failed with HTTP $($response.StatusCode)"
          }
          $assets = @($env:ASSET1, $env:ASSET2, $env:ASSET3, $env:ASSET4, $env:ASSET5)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          $published = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect draft release' }
          if (@($published.assets).Count -ne $assets.Count) { throw 'Unexpected draft assets; remove stale assets before retrying' }
          foreach ($asset in $assets) {
            $name = Split-Path $asset -Leaf
            $uploaded = @($published.assets | Where-Object { $_.name -ceq $name })
            if ($uploaded.Count -ne 1 -or $uploaded[0].size -ne (Get-Item -LiteralPath $asset).Length) {
              throw "Missing or incomplete uploaded asset: $name"
            }
          }
          gh release edit $env:RELEASE_TAG --notes-file $env:RELEASE_NOTES --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
