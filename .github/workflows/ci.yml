name: Validate changes

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name == 'watch' && github.event.watcher.login || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'watch' }}

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Keep repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc
      # turbojpeg is built with SIMD enabled and requires NASM on Windows.
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-x64
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run version:check
      - run: npm run release:test
      # Rust tests embed the configured frontendDist.
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
