name: Build HiViewer plugin

on:
  push:
    branches: [main]
    tags: ["luxe-image-sync-v*"]
    paths:
      - "plugins/luxe-image-sync/**"
      - "src-tauri/src/image_sync/protocol.rs"
      - "src-tauri/resources/translations/**"
      - "src/services/imageSync*.ts"
      - "scripts/image-sync.test.mjs"
      - "scripts/plugin-package.mjs"
      - "scripts/plugin-package.test.mjs"
      - "scripts/plugin-release.mjs"
      - "scripts/plugin-update.test.ps1"
      - "package.json"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "plugins/luxe-image-sync/**"
      - "src-tauri/src/image_sync/protocol.rs"
      - "src-tauri/resources/translations/**"
      - "src/services/imageSync*.ts"
      - "scripts/image-sync.test.mjs"
      - "scripts/plugin-package.mjs"
      - "scripts/plugin-package.test.mjs"
      - "scripts/plugin-release.mjs"
      - "scripts/plugin-update.test.ps1"
      - "package.json"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the versioned plugin and update the stable HiViewer catalog"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hiviewer-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-plugin:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run sync:test
      - run: npm run plugin:test

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Test native protocol and reconnect queue
        run: cargo test --locked --manifest-path plugins/luxe-image-sync/native/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build native-view backend
        run: cargo build --locked --release --manifest-path plugins/luxe-image-sync/native/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Assemble and verify plugin package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginRoot = 'plugins/luxe-image-sync'
          $binDir = Join-Path $pluginRoot 'bin'
          New-Item -ItemType Directory -Force $binDir | Out-Null
          Copy-Item 'plugins/luxe-image-sync/native/target/x86_64-pc-windows-msvc/release/luxe-image-sync.exe' (Join-Path $binDir 'luxe-image-sync.exe')
          npm run plugin -- check $pluginRoot
          $artifactDir = Join-Path $env:RUNNER_TEMP 'luxe-image-sync-artifact'
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          $pluginVersion = (Get-Content -LiteralPath (Join-Path $pluginRoot 'manifest.json') -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "luxe-image-sync-v$pluginVersion") {
            throw 'plugin release tag must match manifest.version'
          }
          $package = Join-Path $artifactDir "luxe-image-sync-$pluginVersion-windows-x86_64.hvp"
          npm run plugin -- pack $pluginRoot $package
          if ($LASTEXITCODE -ne 0) { throw 'plugin packaging failed' }
          node scripts/plugin-release.mjs $package (Join-Path $artifactDir 'plugins.json')
          if ($LASTEXITCODE -ne 0) { throw 'plugin catalog generation failed' }
          $zipProbe = Join-Path $env:RUNNER_TEMP 'luxe-image-sync-zip-probe.zip'
          $probeDir = Join-Path $env:RUNNER_TEMP 'luxe-image-sync-zip-probe'
          Copy-Item -LiteralPath $package -Destination $zipProbe
          Expand-Archive -LiteralPath $zipProbe -DestinationPath $probeDir -Force
          foreach ($required in @('manifest.json', 'main.js', 'checksums.json', 'bin/luxe-image-sync.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $probeDir $required) -PathType Leaf)) {
              throw "invalid .hvp archive; missing $required"
            }
          }
          $checksums = Get-Content -LiteralPath (Join-Path $probeDir 'checksums.json') -Raw | ConvertFrom-Json
          if ($checksums.PSObject.Properties.Name -contains 'version' -or $checksums.PSObject.Properties.Name -contains 'files') {
            throw "invalid checksums.json shape; expected path-to-sha256 map"
          }
          foreach ($required in @('manifest.json', 'main.js', 'bin/luxe-image-sync.exe')) {
            $checksum = $checksums.PSObject.Properties[$required].Value
            if ($checksum -notmatch '^[0-9a-f]{64}$') {
              throw "invalid checksum for $required"
            }
            $actualChecksum = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $probeDir $required)).Hash.ToLowerInvariant()
            if ($actualChecksum -ne $checksum) {
              throw "checksum mismatch for $required"
            }
          }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$package.sha256" -Value "$digest  $(Split-Path $package -Leaf)" -Encoding ascii
          Copy-Item (Join-Path $pluginRoot 'README.md') (Join-Path $artifactDir 'INSTALL-zh-CN.md')
          "PLUGIN_ARTIFACT_DIR=$artifactDir" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: luxe-image-sync-windows-x86_64
          path: ${{ env.PLUGIN_ARTIFACT_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-plugin:
    needs: build-plugin
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/luxe-image-sync-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: luxe-plugin-catalog-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: luxe-image-sync-windows-x86_64
          path: plugin-artifact
      - name: Publish immutable plugin package and stable catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd plugin-artifact
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("plugins.json", "utf8")).plugins[0].version')"
          tag="luxe-image-sync-v$version"
          package="luxe-image-sync-$version-windows-x86_64.hvp"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern "$package" --dir existing
            if ! cmp -s "$package" "existing/$package"; then
              echo "Published plugin versions are immutable. Bump the plugin version before publishing changed bytes." >&2
              exit 1
            fi
          else
            gh release create "$tag" --target "$RELEASE_COMMIT" --draft --latest=false --title "LUXE image sync $version" --notes-file INSTALL-zh-CN.md
            gh release upload "$tag" "$package" "$package.sha256" INSTALL-zh-CN.md
          fi
          gh release edit "$tag" --draft=false --latest=false
          catalog_tag=luxe-plugin-updates
          if gh release view "$catalog_tag" >/dev/null 2>&1; then
            mkdir current
            gh release download "$catalog_tag" --pattern plugins.json --dir current
            node --input-type=module -e '
              import fs from "node:fs";
              const read = p => JSON.parse(fs.readFileSync(p, "utf8")).plugins[0].version.split(".").map(Number);
              const current = read("current/plugins.json"), next = read("plugins.json");
              const index = current.findIndex((part, i) => part !== next[i]);
              if (index >= 0 && current[index] > next[index]) throw new Error("Refusing to downgrade published plugin catalog");
            '
          else
            gh release create "$catalog_tag" --target "$RELEASE_COMMIT" --latest=false --title 'LUXE HiViewer plugin updates' --notes 'Stable plugin catalog for the HiViewer plugin center. Application updates use their own release channel.'
          fi
          gh release upload "$catalog_tag" plugins.json --clobber
