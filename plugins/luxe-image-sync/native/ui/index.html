<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUXE</title>
    <style>
      :root { color-scheme: light dark; font: 14px "Segoe UI", sans-serif; --sync-border: GrayText; --sync-success: LinkText; --sync-warning: CanvasText; }
      body { margin: 0; padding: 18px; background: Canvas; color: CanvasText; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h1 { margin: 0; font-size: 18px; }
      .badge { border: 1px solid var(--sync-border); border-radius: 999px; padding: 3px 9px; font-size: 12px; }
      .badge.ok { color: var(--sync-success); border-color: var(--sync-success); }
      .badge.warn { color: var(--sync-warning); border-color: var(--sync-warning); }
      .path { min-height: 42px; margin: 12px 0; padding: 10px; border: 1px solid var(--sync-border); overflow-wrap: anywhere; line-height: 1.4; }
      .row { display: flex; gap: 8px; }
      button { flex: 1; min-width: 100px; padding: 8px 12px; cursor: pointer; }
      button:disabled { cursor: default; opacity: .55; }
      .muted { opacity: .7; }
    </style>
  </head>
  <body>
    <header><h1>LUXE</h1><span id="connection" class="badge warn">…</span></header>
    <div role="status" aria-live="polite" id="status" class="muted">…</div>
    <div id="path" class="path">…</div>
    <div class="row">
      <button id="previous" type="button" disabled>A</button>
      <button id="next" type="button" disabled>D</button>
    </div>
    <script src="bridge.js"></script>
  </body>
</html>
