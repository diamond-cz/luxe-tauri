# ISP6S 映射配置
# 仅维护仍在使用的权重、图片列表、参数检查、预览信息和源码跳转配置。
# 已移除旧卡片 CWR/Tar、Face/Touch 徽章、LCE.group、空的 CWV 跳转和旧示例。

# HS 权重徽章使用的字段。
[card.Normal.wt]
MainT = "AE_TAG_HSV6_MAINT_WET"
HS    = "AE_TAG_HSV6_HS_WET"
BT    = "AE_TAG_HSV6_BT_WET"
MT    = "AE_TAG_HSV6_MT_WET"
DT    = "AE_TAG_HSV6_DT_WET"
ABL   = "AE_TAG_PROB_ABL"
NS    = "AE_TAG_NS_PROB"

# 图片列表附加列：列名 = 图片同名 TOML 的关键字；缺失值显示 "-"。
# 空景、人像分别维护；筛选时使用对应组，混合列表按关键字合并两组。
# 删除条目可隐藏对应类别的列；空表表示不显示附加列。
# 文件内顺序为初始顺序，手动拖拽后的顺序仍由界面保存。
# idx、缩略图、文件名及计算列由界面管理。
# BV / FDY 还用于图表、计算或分类，修改前请核对数据字段。

# 空景
[image_table.scene]
BV          = "AE_TAG_REALBVX1000"
CWV         = "AE_TAG_CWV"
B2D         = "AE_TAG_DRV6_B2D"
B2M         = "AE_TAG_DRV6_B2M"
hsevd       = "AE_TAG_HS_EVD"
nsevd       = "AE_TAG_NS_EVD"
Normal      = "AE_TAG_PURE_AE_CWR_STABLE"
LINK_AE     = "AE_TAG_LINK_AE_CWR_STABLE"
NS_Prob     = "AE_TAG_NS_PROB"


# 人像
[image_table.portrait]
FaceSt      = "AE_TAG_FACE_20_FACE_AE_STABLE"
"1sSt"      = "AE_TAG_FACE_20_FACE_AE_1STSTABLE"
BV          = "AE_TAG_REALBVX1000"
CWV         = "AE_TAG_CWV"
hsevd       = "AE_TAG_HS_EVD"
nsevd       = "AE_TAG_NS_EVD"
FDR         = "AE_TAG_FLT_DR"
avgfdy      = "AE_TAG_FACE_AVGFDY_0"
gaufdy      = "AE_TAG_FACE_GAU_FDY_0"
FDY         = "AE_TAG_FLT_FDY"
Normal      = "AE_TAG_PURE_AE_CWR_STABLE"
LINK_AE     = "AE_TAG_LINK_AE_CWR_STABLE"
FACE_Prob   = "AE_TAG_FACE_PROB"
SZ_RA       = "AE_TAG_FLT_FDSZ_RA"
NS_Prob     = "AE_TAG_NS_PROB"
Link_Face   = "AE_TAG_LINK_FACE_CWR_STABLE"
FdMinCWR    = "AE_TAG_LINK_FACE_CWR_MIN"

# 参数检查：label 为名称，cpp_path 为源码路径，toml_key 为图片关键字。
[[para_check.items]]
label = "HW"
cpp_path = "[0][0][0].0"
toml_key = "AE_TAG_HW_VER"

[[para_check.items]]
label = "STAT"
cpp_path = "[0][1][0].0"
toml_key = "AE_TAG_STAT_VER"

[[para_check.items]]
label = "FLOW"
cpp_path = "[0][2][0].0"
toml_key = "AE_TAG_FLOW_VER"

[[para_check.items]]
label = "METER"
cpp_path = "[0][3][0].0"
toml_key = "AE_TAG_METER_VER"

[[para_check.items]]
label = "FACE"
cpp_path = "[0][4][0].0"
toml_key = "AE_TAG_FACE_VER"

[[para_check.items]]
label = "SMOOTH"
cpp_path = "[0][5][0].0"
toml_key = "AE_TAG_SMOOTH_VER"

[[para_check.items]]
label = "SYNC"
cpp_path = "[0][6][0].0"
toml_key = "AE_TAG_SYNC_VER"

[[para_check.items]]
label = "HDR"
cpp_path = "[0][7][0].0"
toml_key = "AE_TAG_HDR_VER"

[[para_check.items]]
label = "BV_OFFSET"
cpp_path = "[0][2][1].9"
toml_key = "AE_TAG_BV_OFFSET"

# LCE 预览信息：toml_key 为单值，toml_keys 为同一行的多个值。
[[preview_info.items]]
label = "LV"
toml_keys = ["SW_LCE_LV", "SW_LCE_LVIdx_L", "SW_LCE_LVIdx_H"]

[[preview_info.items]]
label = "DR"
toml_keys = ["SW_LCE_CurrDR", "SW_LCE_DRIdx_L", "SW_LCE_DRIdx_H"]

[[preview_info.items]]
label = "Target"
toml_key = "SW_LCE_FinalTarget"

[[preview_info.items]]
label = "Final_D,B_Strenth"
toml_keys = ["SW_LCE_FinalDStrength", "SW_LCE_FinalBStrength"]

[[preview_info.items]]
label = "Level_D,B_Strenth"
toml_keys = ["SW_LCE_DStrengthLevel", "SW_LCE_BStrengthLevel"]

[[preview_info.items]]
label = "MeterFDTarget"
toml_key = "SW_LCE_MeterFDTarget"

[[preview_info.items]]
label = "MeterFDLinkTarget"
toml_key = "SW_LCE_MeterFDLinkTarget"

[[preview_info.items]]
label = "AEGain"
toml_key = "SW_LCE_AEGain"

[[preview_info.items]]
label = "Face_L,H_Bound"
toml_keys = ["SW_LCE_FaceLoBound", "SW_LCE_FaceHiBound"]

# 源码跳转：keywords / paths / line_ranges 可组合。
# context 为关键字命中范围；jump_to 为跳转位置；highlight 为高亮方式。
[card_source.MainT]
paths = [
  "[0][3][1][20]",
  "[0][3][1][22]", "[0][3][1][23]", "[0][3][1][24]",
  "[0][3][1].65", "[0][3][1].66", "[0][3][1].67", "[0][3][1].68",
  "[0][3][1][45]", "[0][3][1][46]",
  "[0][3][1].73", "[0][3][1].74", "[0][3][1].75", "[0][3][1].76", "[0][3][1].77",
]
jump_to = "first"
highlight = "ranges"

[card_source.Main_Target_Threshold]
paths = ["[0][3][1][22]", "[0][3][1][23]", "[0][3][1][24]"]
jump_to = "first"
highlight = "ranges"

[card_source.MTWV]
paths = ["[0][3][1][20]"]

[card_source.THD]
paths = ["[0][3][1][22]", "[0][3][1][23]", "[0][3][1][24]"]
jump_to = "first"
highlight = "ranges"

[card_source.Weight]
paths = ["[0][3][1][40]","[0][3][1][41]","[0][3][1][42]","[0][3][1][43]"]
jump_to   = "first"      # 多段时滚动到第一段顶部；改 "min" 则滚到行号最小那段
highlight = "ranges"     # 各段独立高亮；改 "union" 则合并成一大块

[card_source.HS]
keywords  = ["//HSv6p0CFG"]
context   = 105
jump_to   = "first"
highlight = "ranges"

[card_source.BT]
keywords  = ["//BT"]
context   = 36
jump_to   = "first"
highlight = "ranges"

[card_source.MT]
keywords  = ["//MT"]
context   = 17
jump_to   = "first"
highlight = "ranges"

[card_source.DT]
keywords  = ["//DT"]
context   = 48
jump_to   = "first"
highlight = "ranges"

[card_source.AOE]
keywords  = ["//CCU_strAEAOEInputParm", "hdr_aoe_*"]
context   = "line"
jump_to   = "first"
highlight = "ranges"

[card_source.NS]
keywords  = ["//CCU_strNSBVCFG", "ns_bv_cfg_btthd"]
context   = 6
jump_to   = "first"
highlight = "ranges"

[card_source.NS_BT]
keywords  = ["//CCU_strNSBVCFG", "ns_bv_cfg_btthd"]
context   = 6
jump_to   = "first"
highlight = "ranges"

[card_source.NS_DT]
keywords  = ["//CCU_strNSBVCFG", "ns_bv_cfg_nsthd"]
context   = 6
jump_to   = "first"
highlight = "ranges"

[card_source.Face]
paths = ["[0][4][1][21]"]

[card_source.Face_FLT]
paths = ["[0][4][1][21]"]

[card_source.Touch]
paths = ["[0][2][1].19","[0][2][1].21","[0][2][1].27"]
jump_to = "first"
highlight = "ranges"

[card_source.ABL]
keywords    = ["//CCU_AE_ABL_SPEC_T", "//CCU_strABL_absDiff"]    # 多关键字 / 正则
paths       = ["[0][3][1][28]", "[0][3][1][36]"]            # 多路径
context   = "line"       # 关键字命中后展开多少行（也可 "block" / "line"）
jump_to   = "first"      # 多段时滚动到第一段顶部；改 "min" 则滚到行号最小那段
highlight = "ranges"     # 各段独立高亮；改 "union" 则合并成一大块
